name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # The step limits are guards against a hang, not measurements, and
    # nothing is cached between runs. The steps take: checkout 1 s, system
    # libraries 32 s, toolchain 1 s, format 2 s, clippy 266 s, test 380 s,
    # release timing 11 s, boundary 2 s, deny 15 s (run 41583328405). The
    # release timing step builds only kernkraft-xdg-apps and its few small
    # dependencies in release (`-p`), so a cache would save next to nothing.
    # The job limit of 60 minutes sits above the slowest run seen, 43
    # minutes 51 seconds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5

      # dbus-daemon: the volume watcher tests start a private one.
      - name: System libraries for Tauri
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          components: rustfmt, clippy

      - name: Format
        timeout-minutes: 5
        run: cargo fmt --all --check

      - name: Clippy
        timeout-minutes: 10
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Two tests need a mount namespace of their own to mount in: the volume
      # watcher's (a tmpfs, mounted and unmounted) and kernkraft-fs's
      # same_filesystem test (a bind mount). The runner's AppArmor policy
      # refuses unprivileged user namespaces, so with this variable each runs
      # `sudo -n unshare --mount --propagation private` for one shell. sudo is
      # used only to create that private mount namespace and to mount in it.
      # The watcher test keeps cargo, the test and the watcher the runner user;
      # the same_filesystem test mounts as root and then drops back to the
      # runner user with setpriv before any test code runs. The btrfs
      # subvolume test of same_filesystem is ignored here: this runner is not
      # on btrfs.
      - name: Test
        timeout-minutes: 15
        env:
          KERN_TEST_SUDO_MOUNTNS: "1"
        run: cargo test --workspace --all-features --no-fail-fast

      - name: Timing budgets (release build)
        timeout-minutes: 30
        run: cargo test --release -p kernkraft-xdg-apps --test mime -- --ignored

      - name: Core crates never depend on the platform
        timeout-minutes: 5
        run: scripts/check-boundary.sh

      - name: Source file headers
        timeout-minutes: 5
        run: scripts/check-headers.sh

      - name: Header check tests
        timeout-minutes: 5
        run: python3 -I scripts/test_check_headers.py

      - name: Text position comparison tests
        timeout-minutes: 5
        run: python3 -I scripts/test_compare_bbox.py

      - name: cargo-deny
        timeout-minutes: 10
        uses: EmbarkStudios/cargo-deny-action@v2

      # The Android graph differs from the desktop one (kernkraft-jni and
      # the `jni` crate are in it), so it is checked on its own for the three
      # targets Kern Android ships.
      - name: cargo-deny (Android)
        timeout-minutes: 10
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/kernkraft-jni/Cargo.toml
          arguments: >-
            --target aarch64-linux-android
            --target armv7-linux-androideabi
            --target x86_64-linux-android

  # kernkraft-pdf and kernkraft-jni against other readers. Every script reads
  # only testdata/, which holds the files we may redistribute: the PDFs that
  # poppler and qpdf open without a password are the inputs, and the rest are
  # skipped by the scripts themselves. A script that checks nothing fails.
  #
  # On a hosted runner the job takes about two and a half minutes: installing
  # the readers 40 s, the toolchain 8 s, the first script 75 s (it builds the
  # examples, which the others reuse), the Android bridge 11 s, and each of
  # the other scripts 2 s or less. A step's limit of 10 minutes is four times
  # the whole job, and the job's 60 minutes leaves room for a runner that is
  # many times slower.
  oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5

      # The `runner` context is not available in a job's `env`, so the output
      # folder is set from the runner's environment.
      - name: Output folder
        timeout-minutes: 1
        run: echo "OUT=$RUNNER_TEMP/oracles" >> "$GITHUB_ENV"

      - name: Other readers
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf mupdf-tools poppler-utils default-jdk-headless \
            fonts-dejavu-core
          qpdf --version | head -n 1
          mutool -v 2>&1 | head -n 1
          pdftotext -v 2>&1 | head -n 1
          javac -version
          test -f "$FONT"

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5

      - name: Compacted copies (qpdf, mutool, poppler)
        timeout-minutes: 10
        run: scripts/check-interop.sh "$OUT/interop" testdata/encrypted/*.pdf

      - name: Page renders (poppler)
        timeout-minutes: 10
        run: scripts/check-render.sh "$OUT/render" testdata/*.pdf testdata/encrypted/*.pdf

      - name: Page operations
        timeout-minutes: 10
        run: scripts/check-page-ops.sh "$OUT/page-ops" testdata/*.pdf testdata/encrypted/*.pdf

      - name: Incremental updates
        timeout-minutes: 10
        run: scripts/check-session.sh "$OUT/session" testdata/*.pdf testdata/encrypted/*.pdf

      - name: Annotations
        timeout-minutes: 10
        run: scripts/check-annot.sh "$OUT/annot" testdata/*.pdf testdata/encrypted/*.pdf

      - name: Embedded fonts
        timeout-minutes: 10
        run: scripts/check-font.sh "$OUT/font" "$FONT"

      - name: Text editing
        timeout-minutes: 10
        run: scripts/check-edit-text.sh "$OUT/edit-text" "$FONT"

      - name: Text positions (poppler)
        timeout-minutes: 10
        run: scripts/check-text.sh "$OUT/text" testdata/*.pdf testdata/encrypted/*.pdf "$OUT"/edit-text/*.pdf

      - name: Android bridge through a JVM
        timeout-minutes: 15
        run: scripts/check-jni.sh "$OUT/jni" testdata/*.pdf testdata/encrypted/*.pdf
