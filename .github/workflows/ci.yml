name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Each step limit is at least four times that step's time in run
    # 40281452851 (the last run that reached every step: checkout 0 s, system
    # libraries 28 s, toolchain 8 s, format 0 s, clippy 128 s, test 191 s,
    # release timing 7 s, boundary 0 s, deny 23 s) and at least 5 minutes, so
    # a hang costs minutes. The release timing step has a wider limit: an
    # earlier run spent about 9 minutes in it when the release build was cold.
    # The measured steps add up to about 6.5 minutes, but a cold run took 43
    # minutes 51 seconds (d4b0ef4), so the job limit is 60 minutes, above that
    # run and not derived from the warm one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      # dbus-daemon: the volume watcher tests start a private one.
      - name: System libraries for MuPDF and Tauri
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon libfontconfig1-dev libfreetype-dev libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          components: rustfmt, clippy

      - name: Format
        timeout-minutes: 5
        run: cargo fmt --all --check

      - name: Clippy
        timeout-minutes: 10
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Two tests need a mount namespace of their own to mount in: the volume
      # watcher's (a tmpfs, mounted and unmounted) and kernkraft-fs's
      # same_filesystem test (a bind mount). The runner's AppArmor policy
      # refuses unprivileged user namespaces, so with this variable each runs
      # `sudo -n unshare --mount --propagation private` for one shell. sudo is
      # used only to create that private mount namespace and to mount in it.
      # The watcher test keeps cargo, the test and the watcher the runner user;
      # the same_filesystem test mounts as root and then drops back to the
      # runner user with setpriv before any test code runs. The btrfs
      # subvolume test of same_filesystem is ignored here: this runner is not
      # on btrfs.
      - name: Test
        timeout-minutes: 15
        env:
          KERN_TEST_SUDO_MOUNTNS: "1"
        run: cargo test --workspace --all-features --no-fail-fast

      - name: Timing budgets (release build)
        timeout-minutes: 30
        run: cargo test --release -p kernkraft-xdg-apps --test mime -- --ignored

      - name: Core crates never depend on the platform
        timeout-minutes: 5
        run: scripts/check-boundary.sh

      - name: Source file headers
        timeout-minutes: 5
        run: scripts/check-headers.sh

      - name: Header check tests
        timeout-minutes: 5
        run: python3 -I scripts/test_check_headers.py

      - name: cargo-deny
        timeout-minutes: 10
        uses: EmbarkStudios/cargo-deny-action@v2
