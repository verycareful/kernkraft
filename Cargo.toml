[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# Cargo takes strict semver, so the label in VERSION (four parts, plus a
# commit index on a dev branch) is written as its first three parts with the
# rest as build metadata: label 0.1.0.0 is 0.1.0+0, label 0.1.0.0.3 is
# 0.1.0+0.3. The kernkraft-fs version test checks the two agree.
version = "0.1.1+0.24"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/verycareful/kernkraft"
# Consumers pin kernkraft by git rev; it is not published to a registry.
publish = false

[workspace.dependencies]
kernkraft-fs = { path = "crates/kernkraft-fs" }
kernkraft-text = { path = "crates/kernkraft-text" }
kernkraft-xdg-apps = { path = "crates/kernkraft-xdg-apps" }
kernkraft-thumb = { path = "crates/kernkraft-thumb" }
kernkraft-bus = { path = "crates/kernkraft-bus" }
kernkraft-theme = { path = "crates/kernkraft-theme" }
kernkraft-volumes = { path = "crates/kernkraft-volumes" }
lopdf = { version = "0.45", default-features = false }
mupdf = "0.6"
thiserror = "2"
tempfile = "3"
rustix = { version = "1", features = ["fs", "process", "event"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# No svgz: usvg would gunzip any input starting 1f 8b with no output cap.
# No memmap-fonts: a mapped font file truncated by another process raises
# SIGBUS in the thumbnailer; fonts are read into memory instead.
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
png = "0.18"
simplecss = "0.2"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# zbus keeps its default async-io backend and is used through the blocking API
# only; the tokio feature stays off (zero network, and no async runtime).
zbus = "5"
inotify = { version = "0.11", default-features = false }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
