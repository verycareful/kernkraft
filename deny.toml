# kernkraft never touches the network: HTTP clients, async runtimes and raw
# socket crates are banned outright. tauri is banned except as a dependency of
# kernkraft-tauri, so no core crate can pull it in; jni is banned outright
# until kernkraft-jni exists. tokio is banned except as a dependency of the
# tauri crates (tauri, its runtime and windowing crates) and kernkraft-tauri,
# which use it for the app runtime and open no socket. `wrappers` names the
# only crates allowed to depend on a banned crate.

[graph]
all-features = true

[advisories]
yanked = "deny"
# zbus 5 is the newest release whose dependency tree opens no socket crate:
# zbus 6 folds in zbus_utils and always pulls socket2, which is banned below.
# zbus's TCP transport code is compiled in but unreachable: connections are
# only built from a Unix stream that kernkraft-bus opens itself.
# These three advisories only say that zvariant, zvariant_derive and
# zbus_names moved into zbus 6; none reports a vulnerability.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant is merged into zbus 6, which requires banned socket2" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is merged into zbus 6, which requires banned socket2" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is merged into zbus 6, which requires banned socket2" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "tokio", wrappers = ["tauri", "tauri-runtime", "tauri-runtime-wry", "wry", "tao", "kernkraft-tauri"] },
    { name = "async-std" },
    { name = "socket2" },
    { name = "tauri", wrappers = ["kernkraft-tauri"] },
    { name = "jni" },
]

[licenses]
confidence-threshold = 0.9
# The list covers licences kernkraft accepts, not only those in use today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The mupdf crates declare "AGPL-3.0", a deprecated SPDX identifier that
# meant the -only form. MuPDF itself is AGPL-3.0 (https://mupdf.com/licensing).
[[licenses.clarify]]
crate = "mupdf"
expression = "AGPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "mupdf-sys"
expression = "AGPL-3.0-only"
license-files = []
